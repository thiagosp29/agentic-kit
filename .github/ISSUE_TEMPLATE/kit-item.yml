name: Proposta de skill, agent ou knowledge
description: Sugira um item novo para o kit ou uma melhoria em um existente.
labels: [kit]
body:
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options: [Skill, Agent, Knowledge]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Nome (kebab-case)
      placeholder: 'ex.: api-design'
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: Quando usar
      description: Em que situação a IA deveria acionar este item? Vira a `description` do frontmatter.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Conteúdo proposto
      description: Rascunho, checklist ou exemplos de antes/depois.
  - type: checkboxes
    id: generic
    attributes:
      label: Escopo
      options:
        - label: O conteúdo é genérico, não específico de uma empresa ou produto.
          required: true
